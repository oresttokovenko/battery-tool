name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token is required: resources created with the default
      # GITHUB_TOKEN (tags, releases, release PRs) fire no events, so
      # publish.yaml's `release: published` trigger would never run
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
          token: ${{ steps.app-token.outputs.token }}
